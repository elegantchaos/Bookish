  <p><span style="font-size:12pt;color:WindowText;">Anne Tyler's <span style="font-style:italic;">The Amateur Marriage</span> is not so much a novel as a really long argument. Michael is a good boy from a Polish neighbourhood in Baltmore; Pauline is a harum-scarum, bright-cheeked girl who blows into Michael's family's grocery store at the outset of World War II. She appears with a bloodied brow, supported by a gaggle of girlfriends. Michael patches her up, and neither of them are ever the same. Well, not the same as they were before, but pretty much the same as everyone else. After the war, they live over the shop with Michael's mother until they've saved enough to move to the suburbs. There they remain with their three children, until the onset of the 60s, when their eldest daughter runs away to San Francisco. Their marriage survives for a while, finally crumbling in the 70s.
  
  
  
  If this all sounds a tad generic, Tyler's case isn't helped by the characteristics she's given the two spouses. Him: repressed, censorious, quiet. Her: voluble, emotional, romantic. Mars, meet Venus. What marks this couple, though, and what makes them come alive, is their bitter, unproductive, tooth-and-nail fighting. Tyler is exploring the way that ordinary-seeming, prosperous people can survive in emotional poverty for years on end. She gets just right the tricks Michael and Pauline play on themselves in order to stay together: "How many times", Pauline asks herself, "when she was weary of dealing with Michael, had she forced herself to recall the way he'd looked that first day? The slant of his fine cheekbones, the firming of his lips as he pressed the adhesive tape in place on her forehead". Only in antogonism do Michael and Pauline find a way to express themselves. <span style="font-style:italic;">--Claire Dederer, Amazon.com&nbsp;</span></span></p>
  
