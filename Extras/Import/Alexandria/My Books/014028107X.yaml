  <p><span style="font-size:12pt;color:WindowText;">Many are the writers who tackle the field of the psychological thriller, but few create such a dark and compelling world as Nicci French. <span style="font-style:italic;">The Red Room</span> inhabits the same sinister universe as such previous thrillers as <span style="font-style:italic;">The Memory Game</span> and the book that many consider to be her finest to date, <span style="font-style:italic;">Killing Me Softly</span>. French is concerned with the unstable surface of reality and the malign undercurrents of human behaviour forever threatening to disrupt the tenuous happiness of her characters. In <span style="font-style:italic;">The Red Room</span>, her particular priority is the queasy attraction of the forbidden and the terrifying.
  
  
  
  Kit Quinn has a job that many would find too disturbing to tackle. Her beat is the world of crime scenes, hospitals for the criminally insane, the grimmer prisons. In her latest assignment, colleagues in the police ask for her help in what initially appears to be a straightforward murder inquiry, in which a youthful runaway has been killed near a London canal. At first, the evidence points to the killer being a man who wounded the murdered young woman, but Kit has learned that the appearance of things in a deceptive world may not be trusted. As she descends deeper and deeper into a brutal underworld of lost and exploited youngsters, she finds herself as at risk as the young victims she is dealing with.
  
  
  
  What makes this more than a conventional thriller is the author's fastidious examination of her heroine's tortured psyche. Kate has suffered terrible wounds in a savage attack, and there is something unhealthy about her immersion in the kind of life that left her with terrible scars. French is particularly sharp on her efforts to push her life back into some kind of conventional order. <span style="font-style:italic;">The Red Room</span> has the customary dangerous voyage to the centre of a mystery that is par for the course for the genre, but this is also a study of the troubled psyche of a damaged heroine, and her dark world view: Beware of beautiful days. Bad things happen on beautiful days. It may be that when you get happy, you get careless. Beware of having a plan. Your gaze is focused on the plan, and that's the moment when things start happening just outside your range of vision ...
  
  
  
  --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
