notes: |-
  <p><span style="font-size:12pt;color:WindowText;">No longer is Henning Mankell a name known to just a privileged few. <span style="font-style:italic;">Before the Frost</span> will have a readership far greater than his first European fans, those lucky enough to have encountered some of the finest modern crime writing from a Swedish master. His recent novel, <span style="font-style:italic;">Firewall</span>, further developed the cool, utterly gripping style that had become his trademark: modern society and its eccentricities stripped bare, with Sweden ably standing in for the whole of western society. In that book, Mankell's dogged copper Inspector Kurt Wallander investigated crime in cyberspace (as the country experienced electricity blackout), and anarchist cyber terrorists tested Wallander's mettle. But Mankell was showing signs of wanting something new, and <span style="font-style:italic;">Before the Frost</span> delivers that--in spades.
  
  
  
  Linda Wallander--Kurt's daughter--is cut from the same cloth as her resourceful father, and as a new detective character for Mankell, she'll do very nicely, even if a certain amount of adjustment is needed on the reader's part. In the dark forest near Ystad, a grisly find is made: human hands and a severed head, arranged in a grim mockery of prayer. A bible, seemingly heavily annotated by the killer is also found. But this is just one of series of bizarre incidents that have been taxing inspector Kurt Wallander: including domestic pets being attacked. Not a good time, in fact, for Wallander's daughter Linda to make her debut as another detective on the force. But (needless to say) she soon gives her father a run for his money in identifying the criminals involved--a sinister group with biblical punishments on their unflinching agenda.
  
  
  
  While Linda has some way to go to make herself as beloved a protagonist as her father, the auguries here are very promising, with plotting compensating for the gearshifts involved.--<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
publisher: "The Harvill Press"
