  <p><span style="font-size:12pt;color:WindowText;">A new world had emerged, and he hadn't even noticed it. As a policeman, he still lived in another, older world. How was he going to learn to live with the new? . . We live as if we were in mourning for a lost paradise, he thought...
  
  
  
  It could be said that as a policeman, Kurt Wallander, Swedish crime writer Henning Mankell's award winning creation, isn't much cop. He eschews the meticulous and the scientific in favour of his hunches, which all too often lead up blind alleys. He drinks too much, then drives. He doesn't get enough sleep. And to cap it all, his wife has left him and his daughter doesn't speak to him.
  
  
  
  <span style="font-style:italic;">Faceless Killers</span> is the first of the acclaimed Wallander novels. Set in January 1990, in a frozen landscape and against the backdrop of a rapidly changing Europe, this is a bleak novel that deals with the thorny issues of immigration and racial hatred. Wallander investigates a brutal double murder at a remote farmhouse in which the only possible clues are the whispered words of a dying woman and a freshly fed horse. When this limited evidence and its implications leak to the press it stirs right wing activists into action.
  
  
  
  At times Wallander seems too much like the traditional hard-drinking, hard-living, hard-boiled detective of old, but he is more than that. He is a truth seeker, trying to make sense of his rapidly changing world, his method happens to be detective work, and it is this search that lies at the philosophical heart of the novel. --<span style="font-style:italic;">Iain Robinson&nbsp;</span></span></p>
  
