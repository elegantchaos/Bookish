  <p><span style="font-size:12pt;color:WindowText;">It's a time-honoured tradition that the best crime writers begin to chafe at the constraints of their area of the genre and feel a need to stretch their literary muscles. With <span style="font-style:italic;">The Grave Tattoo</span>, the estimable Val McDermid demonstrates that she, too, has felt the need of a change from her contemporary novels of crime and detection, and here takes on a truly ambitious panoply. Not that McDermid has been afraid to tackle unconventional subjects before--it's just that the scale of this novel is even more impressive. A corpse is discovered on a hill in the Lake District, adorned with bizarre tattoos. Wordsworth expert Jane Gresham finds herself distracted from her studies of the great Lakeland poet when another mystery surfaces, involving the Pitcairn Massacre and the events of the mutiny on the Bounty. Is it possible that Fletcher Christian, who led the rebellion against Captain Bligh, faked his own death and clandestinely returned to England? Jane makes a connection between the tattooed body and the tattoos on sailors who served in the South Seas--is this the body of Fletcher Christian? And Jane has another problem on her hands--a young girl who she has tried to help finds herself a murder suspect, and tracks her down to the Lakes. And as Jane closes in on a Wordsworth manuscript that may be a direct transcription of Fletcher Christian's confession, she finds herself with someone else on her trail--an ex-lover with similar designs on the precious document.
  
  
  
  As all this might suggest, McDermid has set herself a truly daunting task here, with a canvas so crammed with incident, colour and character. And when the reader learns that the central narrative is counterpointed with sections from the Fletcher Christian document, it's clear that we are a long way away from the medical and criminological puzzles of <span style="font-style:italic;">Wire in the Blood</span>. It is to McDermid's credit that she draws so many strands together with such assurance.
  
  --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
