  <p><span style="font-size:12pt;color:WindowText;">In <span style="font-style:italic;">One for My Baby</span> Hong-Kong-based language teacher Alfie Budd is about to ingest several gallons of the stuff. Returning to London to nurse a broken heart, he finds a world he barely recognises. Terry Wogan plays REM on Radio Two, there are Tai Chi classes on Highbury Fields and the England of Alfie's youth seems a distant dream. Alfie's father is now sporting disco gear and pitifully clinging onto his relationship with a Czech au pair half his age. Alfie's mother, meanwhile, cares a great deal about her rose bushes and not at all about getting her husband back.
  
  
  
  Dazed by these changes, Alfie drifts--on a cloud of Tsingtao beer and Sinatra-fuelled reverie--into a new teaching job and into a string of pointless affairs with his students. But a man can only drift for so long before he starts to sink--and Alfie must learn some bitter lessons before he can regain the happiness he once knew in Hong Kong.
  
  
  
  Tony Parsons' second novel deserves to match the phenomenal success of his first, <span style="font-style:italic;">Man and Boy</span>--although there are reasons why it might not. <span style="font-style:italic;">One for My Baby</span> lacks the cutesy appeal of single fathers bringing up sons and some readers may find it--with its double portion of deaths and mid-life depressions--a more demanding read altogether. The book deals with tough realities, with people who have ceased to love themselves and each other, with snobbery and prejudice and the acute loneliness of city life. But the tale is redeemed, ultimately, because humour and warmth pervade even its darkest corners. The laughable antics of Alfie's father are balanced beautifully by George Chang, Alfie's serene and dignified Tai Chi instructor. And while our hero's journey is an arduous one, we are invited to laugh with and at him and never to pity him. Mr Parsons deserves praise for creating a book that is not merely different to his first but also bigger, tougher and cleverer. --<span style="font-style:italic;">Matthew Baylis&nbsp;</span></span></p>
  
