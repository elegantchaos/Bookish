  <p><span style="font-size:12pt;color:WindowText;">The eight areas of stability in an otherwise endlessly changeable landscape are slowly eroding, and attempts by the church authorities to keep everything from changing-- hereditary employment, laws against new fashions--are proving futile. As people travel from Stability to Stability for trade or pilgrimage, they need maps, accurate maps; and a map that changes with the landscape is the most prized of all, something men and demons will kill for. Keris inherits such a map from her murdered father, and goes on the run for the crime of rejecting a suitor and being good at the unwomanly occupation of mapmaking. Soon she finds herself involved with the gloomy Davron, a guide whose relationship with the demon lord Carasma is not what the pious might wish. Noramly's first novel takes a number of the stock assumptions of genre fantasy and does the welcome job of actually thinking about them. Both the way magic works here, and the effect it has on her characters, are fresh; she takes what might have been clich�s and polishes them up all shiny and new. Ironies abound and reader expectations are constantly forced to shift to new ground; Noramly has made herself, with her first novel, a name to watch. --<span style="font-style:italic;">Roz Kaveney&nbsp;</span></span></p>
  
