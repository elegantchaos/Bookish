  <p><span style="font-size:12pt;color:WindowText;">Say you've spent the first 10 years of your life sleeping under the stairs of a family who loathes you. Then, in an absurd, magical twist of fate you find yourself surrounded by wizards, a caged snowy owl, a phoenix-feather wand and jellybeans that come in every flavour, including strawberry, curry, grass and sardine. Not only that, but you discover that you are a wizard yourself! This is exactly what happens to young Harry Potter in J K Rowling's enchanting, funny debut novel, <span style="font-style:italic;">Harry Potter and the Philosopher's Stone</span>. In the non-magical human world--the world of "Muggles"--Harry is a nobody, treated like dirt by the aunt and uncle who begrudgingly inherited him when his parents were killed by the evil Voldemort. But in the world of wizards, small, skinny Harry is renowned as a survivor of the wizard who tried to kill him. He is left only with a lightning-bolt scar on his forehead, curiously refined sensibilities and a host of mysterious powers to remind him that he's quite, yes, altogether different from his aunt, uncle, and spoilt, pig-like cousin Dudley.
  
  
  
  A mysterious letter, delivered by the friendly giant Hagrid, wrenches Harry from his dreary, Muggle-ridden existence: "We are pleased to inform you that you have been accepted at Hogwarts School of Witchcraft and Wizardry". Of course, Uncle Vernon yells most unpleasantly, "I AM NOT PAYING FOR SOME CRACKPOT OLD FOOL TO TEACH HIM MAGIC TRICKS!" Soon enough, however, Harry finds himself at Hogwarts with his owl Hedwig ... and that's where the real adventure--humorous, haunting, and suspenseful--begins.
  
  
  
  This magical, gripping, brilliant book--a future classic to be sure--will leave children clamouring for a sequel. (Ages 8-13) --<span style="font-style:italic;">Karin Snelson&nbsp;</span></span></p>
  
