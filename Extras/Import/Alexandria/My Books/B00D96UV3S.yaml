  <p><span style="font-size:12pt;color:WindowText;">Journalist, Oliver Neery, does something no journalist has done for a long time, in the alternate reality of Two All - All For One: he breaks a story that won't have anyone's cup size mentioned in it.
  
  
  
  Information has been thrust into his reluctant hands regarding the City Father's plans for the over-crowded City of Scotland's less fragrant denizens, and much as he'd like to, he can't ignore it.
  
  
  
  Unfortunately, his attempt to expose them is thwarted, and it looks like his time is up. Luckily, however, Oliver has friends living beyond the City boundaries willing to risk their lives to rescue him; unluckily, they don't have a clue what they're doing - but the Guardian does, and she doesn't do prisoners, but then she doesn't particularly do humans - full stop. Well...except for maybe the one.&nbsp;</span></p>
  
