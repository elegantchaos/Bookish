  <p><span style="font-size:12pt;color:WindowText;">Ashraf Bey is not who he seems--a rich Ottoman aristocrat to whom the Iskandryia of a rather different 21st century is more or less his oyster--nor is he simply what he thinks he is--a minor street criminal shipped off to North Africa when he fell foul of his employers. Accused yet again of murders he did not commit, he finds out on the run that he is better than he thinks he is--smarter and more capable and also someone whom people trust and love.
  
  
  
  Set in a mildly different alternate world, <span style="font-style:italic;">Pashazade</span> is a thriller with a solidly imagined mystery at its core; it is also a novel about a man finally and belatedly growing up. Ashraf's sense of responsibility for an orphaned girl and for the woman with whom he has refused an arranged marriage are part of what makes him admirable; he has learned the hard way not to treat people as disposable. The details of this alternate near future--an Arab world that remained Turkish after a 1914 war that never quite became important, and into which some slick cybertechnology and genetic gadgetry have slotted without changing anything fundamental--are effectively imagined, but never more important than the people. --<span style="font-style:italic;">Roz Kaveney&nbsp;</span></span></p>
  
