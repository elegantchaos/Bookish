notes: |-
  <p><span style="font-style:italic;font-size:12pt;color:WindowText;">The Eye of the World<span style="font-style:normal;"> and its sequels in Robert Jordan's </span>Wheel of Time<span style="font-style:normal;"> series show the extent to which one can go with a traditional fantasy framework, with added gusto. Stock elements are abound: a reluctant hero--in fact five humble village folk--plucked from wholesome obscurity to fight dark powers; an eternal evil enemy who can be defeated but not destroyed, until the end of the world, which is fast approaching; a mysterious sisterhood with vast powers and who love to manipulate thrones and kingdoms from the shadows (think of the Bene Gesserit of the </span>Dune<span style="font-style:normal;"> series); a ferocious battle-hardened warrior race (echoes of the Fremen of </span>Dune<span style="font-style:normal;">, or the Haruchai of the </span>Thomas Covenant<span style="font-style:normal;"> novels).
  
  
  
  Jordan didn't become a bestselling author merely by mixing up traditional ingredients; a master storyteller, he ingeniously gives unusual twists to these conventional fantasy elements. He also excels in the descriptive and narrative skills needed to create a detailed and coherent imaginary world. The many lands he portrays are vast in scope and contain amazingly varied countries and peoples, while retaining the inner coherence needed to make them satisfying places for a fantasy fan to roam around in. However, Jordan's writing never attains the subtlety or sophistication of, say, George RR Martin and there are some annoying stylistic tics: he seems unable to introduce a female character without commenting on her neckline and thereafter has them forever smoothing their dresses.
  
  
  
  To his publisher's credit, Jordan's books are fortunate among fantasy novels in not having covers that look like an explosion of a teenager's bedroom. The absence of such lurid artwork is, perhaps, part of their appeal. --</span>David Pickering&nbsp;</span></p>
  
publisher: "Orbit"
