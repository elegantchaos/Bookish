notes: |-
  <p><span style="font-size:12pt;color:WindowText;">Aimed at the working C++ game developer, <span style="font-style:italic;">3D Game Engine Design</span> provides a tour of mathematical techniques for 3-D graphics and the source code used to implement them in state-of-the-art video game engines. If you work in the game industry (or would like to), this book will serve you well because it delivers excellent best practices for algorithms and programming techniques that will help your software keep up with the competition.
  
  
  
  This text is a virtual encyclopaedia of expertise, based on the author's own work and research in the gaming industry. It provides the mathematical notation, algorithms, and C++ code (on the accompanying CD-ROM) needed to build fast and maintainable game engines. Early sections start with the basics, with the math used to work with common 3-D objects (like spheres and boxes). Highlights include a high-powered review of quaternion algebra, the preferred way to transform 3-D data in many cases.
  
  
  
  The chapters on graphics pipelines explain the math behind representing and rendering a 3-D world in 2-D with intervening effects like lighting, texture mapping and the like. A variety of current algorithms are provided for representing 3-D scenes, efficient <span style="font-style:italic;">picking</span> (which allows a programmer to determine which object in a 3-D world has been selected) and <span style="font-style:italic;">collision detection</span> (where objects collide virtually). In the game software of today, curves--rather than individual triangles or polygons--are often used to represent 3-D objects. Algorithms that are used to turn curves into rendered surfaces are also provided.
  
  
  
  Later sections look at current thinking about animation techniques for characters (including <span style="font-style:italic;">key frames</span>, <span style="font-style:italic;">inverse kinematics</span> and <span style="font-style:italic;">skinning</span>--in which digital skin is fitted over digital bone to create more realistic-looking movement). How to represent terrain inside virtual worlds is also explained. The book closes with excellent material on cutting-edge special effects like lens flare and projected shadows, which can add an extra level of realism to a video game. An appendix examines guidelines for designing object-oriented game software in C++.
  
  
  
  Filled with mathematical insight and expert code that puts each principle or algorithm to work, <span style="font-style:italic;">3-D Game Engine Design</span> provides an expert view of what goes into building a state-of-the-art game engine. --<span style="font-style:italic;">Richard Dragan&nbsp;</span></span></p>
  
publisher: "Morgan Kaufmann"
publishing_year: "2006"
