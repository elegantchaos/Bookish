  <p><span style="font-size:12pt;color:WindowText;">Keva McCluskey, lead singer of Liverpool band The Grams, is convulsed with jealousy when their inferior rivals Sensira hit the headlines. But a fortuitous meeting with society Trustafarian Guy de Burret boots the unsuspecting Grams straight into the harsh limelight. The band's camaraderie is rent asunder, as a bewildering host of journalists, music moguls and parasites works its sinister magic. The Grams have to fight to save their minds, their bodies and their friendship. They win, lose and ultimately, win again in this bacchanalian tale of sex, drugs. And rock'n'roll.
  
  
  
  <span style="font-style:italic;">Powder</span> describes a world riddled with falsehoods in an entirely truthful voice. Sampson knows the business inside out, and the book teems with the sort of detail few music lovers could conceive of. Ordinary lads turned rock gods acquire some laughable foibles, and Sampson draws his characters, and their picaresque adventures, with laugh-out-loud wit and often moving warmth. (Keva's worst fear is turning 30, while drummer Beano only wants a nice girl to cook him stew). This is a breathless, adrenaline-fired tale-- whether you are a vinyl junkie or watch the pop world in fascinated horror, you will find <span style="font-style:italic;">Powder</span> as bewitching as the world it depicts. --<span style="font-style:italic;">Matthew Baylis&nbsp;</span></span></p>
  
