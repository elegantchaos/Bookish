  <p><span style="font-size:12pt;color:WindowText;">Frankie Blue has an overwhelming desire to fit in somewhere. Up until now, his friends have kept him grounded, but, with his wedding day fast approaching, Frankie starts to question his relationship with the lads as well as his relationship with Vronky, his glamourous, sexy but suddenly nagging fiancee.
  
  
  
  <span style="font-style:italic;">White City Blue</span> could so easily have fallen into the makeshift-Nick Hornby-throwback trap, but is saved by the fact that it is actually quite an articulate study of a man made of little more than the suit he wears and the car he drives.
  
  
  
  Frankie is as sharply observed as a character with little to offer can be, and he and his cronies present a darkly comic yet ultimately tragic insight into the nature of friendship between men. His relationships with Nodge, Colin and Tony seem to consist of little more than a few beers and the annual piss-up in August, yet as Frankie's time-warp of a life moves gradually forward, the real nature of their relationship is blown apart and the truth about how little they really know each other becomes apparent.
  
  
  
  <span style="font-style:italic;">White City Blue</span> begins with a sprinkling of familiar humour that lulls the reader into a false sense of security. By the end of the novel, the mood has darkened and the vulnerability of the hitherto cock-sure Frankie and his mates peeps through.
  
  
  
  One for the boys, certainly--but beware: once they see there is more to this than birds and booze they may start shifting uncomfortably in their boxers.--<span style="font-style:italic;">Susan Harrison&nbsp;</span></span></p>
  
