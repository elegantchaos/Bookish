  <p><span style="font-size:12pt;color:WindowText;">Shea Hickson has problems. Not only have his formerly radical sixties parents christened him after their revolutionary hero Che Guevara, but his similarly symbolically named brother, Orwell, has run off with the love ofShea's disaffected life, Rebecca. As Christmas looms, Shea's horizons darken as he accidentally impregnates his "randy hairdresser whose name I'd forgotten" and then arrives at his parent's house to discover his fatherdangling from a light fitting. As Shea begins to piece together the increasingly unpleasant reasons for the suicide of his father, a former BBC weatherman, storm clouds gather and the forecast looks increasingly bleak.
  
  
  
  Sean Hughes' second novel <span style="font-style:italic;">It's What He Would've Wanted</span>, follows in the darkly humorous vein of his highly acclaimed first novel <span style="font-style:italic;">The Detainees</span>, as Shea unravels his opening cryptic remark that "I wish I'd been born to different parents. They are decent enough folk, but." Shea's disillusioned, shambolic thirtysomething existence is turned upside down as he unravels the increasingly distasteful domestic secrets of his father's disappointed life as a wannabe revolutionary and disillusioned minor media celebrity. Hughes takes us on a funny but often bleak journey through the seamier side of London life, skirting the fringes of the world of TV, newspapers and small-scale urban terrorism. There are some grimly funny set pieces, which usually revolve around Shea's revolting but surprisingly successful sex life. Although Shea's existential angst can become a little predictable, anyone who enjoys Hughes' downbeat stand-up routine will relish <span style="font-style:italic;">It's What He Would've Wanted</span>. --<span style="font-style:italic;">Jerry Brotton&nbsp;</span></span></p>
  
