  <p><span style="font-size:12pt;color:WindowText;">While PD James' <span style="font-style:italic;">The Lighthouse</span> moves satisfyingly in territory that the author has made very much her own -- the classic English crime mystery -- there are several new elements added, proving that Baroness James is not content to rest on her laurels. While Commander Adam Dalgliesh is once again at work, solving a case of murder in a secluded setting, cut off from the rest of the world (James has long been pleased to introduce variations into the beloved crime situations that exercised her predecessors), and while the structure of the novel presents the reader with the usual strongly drawn cast of suspects and victims, there is a new frankness here, with the treatment of sexuality more upfront than would ever have been countenanced in the era of Dorothy Sayers and co. But long-time readers of this most accomplished of British novelists will also be pleased to learn that the things we turn to James for are all satisfyingly in place.
  
  
  
  A secluded island off the Cornish coast, renowned for its history of bloody piracy, has become a retreat for under-pressure men and women in the upper echelons of society. But when one of their number is murdered in a grotesque fashion (his body found on the eponymous lighthouse), Adam Dalgliesh is requested to solve the case, but with maximum discretion. However, it is not a good time for Dalgliesh and his team: he himself is going through a fraught period with the woman in his life, Emma Lavenham, while DI Kate Miskin is struggling with similar upheavals in her life. And their Anglo-Indian associate, Francis Benton-Smith, has his own problems in regard to working with Kate. Nevertheless, the team make progress on the island, until a second savage murder threatens to bring chaos.
  
  
  
  It's easy to underestimate James' achievement with Dalgliesh and co. So often, long-time series characters betray signs of their authors' growing disinterest, but James has always managed to find new nuances to ensure that we never tire of her cultivated copper. And there's pleasure here in seeing familiar themes orchestrated with such finesse: the difficult, combative figure who alienates a host of people (and thereby set themselves up as a candidate for murder) and, best of all, the cloistered setting -- often a clich� of the genre -- but here, treated with freshness and imagination. --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
