notes: |-
  <p><span style="font-size:12pt;color:WindowText;">Paced like a cheetah and clever as anything, Justina Robson's second novel <span style="font-style:italic;">Mappa Mundi</span> offers us a particularly scary take on the possibilities of technology, on what it is to be, and to remain. Half-Cheyenne FBI man Jude tracks down criminal masterminds who play with genetic perfection; his supposed partner Mary is there to stop him getting too close to those illegal experiments the US government wants to succeed. Disturbed psychologist Natalie is caught up with attempts to re-engineer sanity in human brains, horridly aware of the possibility that this new technology might be misused and anxious about her feckless drug-using flatmate and best friend.
  
  
  
  This is a book that endlessly spins off intelligent ideas and keeps its momentum without ever bogging down in dumps of crude information. Justina Robson has a solid sense of where her characters come from, both geographically and emotionally, and even her villainess Mary is credibly motivated in every last shabby thing she does. <span style="font-style:italic;">Mappa Mundi</span> asks some terrifying questions about technology--there are some things that cannot be uninvented, and, invented, are going to be used for good or ill. Justina Robson's first novel <span style="font-style:italic;">Silver Screen</span> demonstrated her skill and intelligence; <span style="font-style:italic;">Mappa Mundi</span> reveals her entire emotional and intellectual maturity. --<span style="font-style:italic;">Roz Kaveney</span>
  
  
  
  <span style="font-style:italic;">Mappa Mundi</span> is joint winner of the Amazon.co.uk Writers' Bursaries 2000&nbsp;</span></p>
  
