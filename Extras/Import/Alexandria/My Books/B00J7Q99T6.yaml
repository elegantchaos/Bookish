  <p><span style="font-size:12pt;color:WindowText;">The Galactics arrived with their Battle fleet in 2052. Rather than being exterminated under a barrage of hell-burners, Earth joined a vast Empire that spans the Milky Way. Our only worthwhile trade goods are our infamous mercenary legions, elite troops we sell to the highest alien bidder.
  
  
  
  In 2122 a lost colony expedition contacts Earth, surprising our government. Colonization is against Galactic Law, and Legion Varus is dispatched to the system to handle the situation. Earth gave them sealed orders, but Earth is thirty-five lightyears away. The Legion commanders have a secret plan of their own. And then there's James McGill, who was never too good at listening to authority in the first place...
  
  
  
  In DUST WORLD, book two of the Undying Mercenaries Series, McGill is promoted to Specialist and sent to a frontier planet outside the Empire. Earth's status within the Empire will never be the same.&nbsp;</span></p>
  
