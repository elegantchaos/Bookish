  <p><span style="font-size:12pt;color:WindowText;">The writing of Tim Winton has long been noted for its elegance, precision and keen insight into the human soul. With <span style="font-style:italic;">The Turning</span>, we are given one of the most precise and satisfying distillations of the novelist's art, albeit in what has long been something of an unfashionable form: the short story. The form is often regarded by publishers as something of a commercial liability, even though many great writers (from Somerset Maugham to William Trevor) have excelled in shorter fiction. But Winton, as well as being one of the finest novelists Australia has ever produced, is also a master of the form. The seventeen overlapping tales here encapsulate some of the most insightful observations that he has given us.
  
  
  
  What makes the stories so unusual is the fashion in which Winton has managed to find the unusual within the everyday--here, ordinary people are subjected to extraordinary pressures, and everything from middle-aged loss to youthful vacillations of the heart crafted with great skill.
  
  
  
  Winton (who was born in Perth in Western Australia) has published fifteen books and has won a variety of literary prizes. The stories here can only add lustre to his reputation. <span style="font-style:italic;">Big World</span> is the story of a friendship between two undergraduates who take on unsatisfactory jobs one frigid January, such as sluicing the blood from the floor of a local meat factory. The duo set off by car in pursuit of diversion, and we learn that neither is particularly lovable (particularly the eccentric Biggie); as the tale advances, the narrator learns to his cost that friendship comes at a price. This immensely involving piece is written in the kind of lambent prose that often aspires to the condition of poetry, despite the banality of the two young men's lives. Similarly, <span style="font-style:italic;">The Turning</span> deals with trailer life, and its unhappy, unfulfilled working-class women are brilliantly characterised. Whatever your feelings about the short story form, you will be doing yourself a disservice to miss this collection. --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
