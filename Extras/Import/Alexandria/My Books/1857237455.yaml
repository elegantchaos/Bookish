notes: |-
  <p><span style="font-size:12pt;color:WindowText;">The praise that greeted Chaz Brenchley's <span style="font-style:italic;">Tower of the King's Daughter</span> in hardback was considerable, with particular praise being lavished on the elegant prose. But this first book marked the astute reader's card in no uncertain terms: here was a fantasy sequence to rival the most impressive in the genre. Book Two, <span style="font-style:italic;">Feast of the King's Shadow</span> is similarly impressive. Atmosphere is an element often missing from epic fantasy but it's conjured with tremendous skill in this book, never, however, allowing it to swamp the adroit plotting. The Kingdom of Outremer has been raised on sands that have run with the copious blood of battle and it has enjoyed an uneasy peace. However, war is returning. The Sharai tribes, never at ease in defeat, have realised that they must unite at the stronghold in Rabat to achieve strength again. They see their saviour as the Ghost Walker, the hope and deliverer of the people. The Ghost Walker has returned, but not to the Sharai. The chosen man is Marron, who has been a Ransomer from Outremer, and is not yet aware of what he hasbecome. His companions sense the power coursing through him and try to persuade him that his destiny lies in Rabat. Many people want to control the Ghost Walker, who will wield immense power. But Marron has his own ideas. Part of the pleasure of this searing piece is its subtle mixture of genres, with even Chaz Brenchley's experience as a crime writer feeding through into some of the mysteries and revelations. Marron may be a protagonist cut from familiar cloth but he's more than serviceable as a central figure in this exhilarating piece. --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
