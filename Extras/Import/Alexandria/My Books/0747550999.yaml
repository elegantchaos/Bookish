  <p><span style="font-style:italic;font-size:12pt;color:WindowText;">Harry Potter and the Goblet of Fire<span style="font-style:normal;"> is the long-awaited, heavily hyped fourth instalment of a phenomenally successful series that has captured the imagination of millions of readers, young and old, across the globe. For J K Rowling the pressure is certainly on to continue to come up with thrilling, pacey storylines that allow her hero to mature into a young man without detracting from the magical secret that has made Harry into a superstar. In this book, the teenage Harry has a certain gawky charm that fits well with his advancing adolescence. As the story moves on, Harry too moves on to a new level of maturity that leaves the reader wondering how he will learn from his experiences, and liking him all the more as a character.
  
  
  
  Once returned to Hogwarts after his summer holiday with the dreadful Dursleys and an extraordinary outing to the Quidditch World Cup, the 14-year-old Harry and his fellow pupils are enraptured by the promise of the Triwizard Tournament: an ancient, ritualistic tournament that brings Hogwarts together with two other schools of wizardry--Durmstrang and Beauxbatons--in heated competition. But when Harry's name is pulled from the Goblet of Fire, and he is chosen to champion Hogwarts in the tournament, the trouble really begins. Still reeling from the effects of a terrifying nightmare that has left him shaken, and with the lightning-shaped scar on his head throbbing with pain (a sure sign that the evil Voldemort, Harry's sworn enemy, is close), Harry becomes at once the most popular boy in school. Yet, despite his fame, he is totally unprepared for the furore that follows.
  
  
  
  This is a hefty volume: 636 pages, of which probably at least 200 could have been cut without detracting from the story. The weight and complexity of the book is perhaps a hint that Rowling now has her eye sharply focused on her adult audience, and the average child-reader (particularly one who is coming to Harry Potter for the first time) may well find its girth daunting. Rowling's ironic and pointed observations on tabloid journalism and the nature of media hype is just one of the references littered through the book that will tickle the grown-ups but may well fly over the heads of her young fans.
  
  
  
  However, after a slow start, </span>Harry Potter and the Goblet of Fire<span style="font-style:normal;"> really starts to sparkle halfway through with Rowling's familiar magic (and yes, there is a death--sudden and tragic--and yes, Harry does start to notice girls). The crux of this story, however, is Harry's gradual coming-of-age and his handling of the increasingly determined threats to his own life.
  
  
  
  This book is pivotal, not just for the author for whom the heat is well and truly on, but for Harry and his readers who, by the last chapter, are left in little doubt that there is much more to come. (Ages 10 to adult) --</span>Susan Harrison&nbsp;</span></p>
  
