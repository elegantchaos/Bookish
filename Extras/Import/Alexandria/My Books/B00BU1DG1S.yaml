  <p><span style="font-size:12pt;color:WindowText;">The record-breaking debut novel that won every major science fiction award in 2014, <span style="font-style:italic;">Ancillary Justice</span> is the story of a warship trapped in a human body and her search for revenge. Ann Leckie is the first author to win the Arthur C. Clarke, the Nebula and the Hugo Award for Best Novel in the same year.
  
  
  
  <span style="font-style:italic;">They made me kill thousands, but I only have one target now.</span>
  
  
  
  The Radch are conquerors to be feared - resist and they'll turn you into a 'corpse soldier' - one of an army of dead prisoners animated by a warship's AI mind. Whole planets are conquered by their own people.
  
  
  
  The colossal warship called <span style="font-style:italic;">The Justice of Toren</span> has been destroyed - but one ship-possessed soldier has escaped the devastation. Used to controlling thousands of hands, thousands of mouths, <span style="font-style:italic;">The Justice</span> now has only two hands, and one mouth with which to tell her tale.
  
  
  
  But one fragile, human body might just be enough to take revenge against those who destroyed her.
  
  
  
