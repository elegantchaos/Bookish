notes: |-
  <p><span style="font-size:12pt;color:WindowText;">If there's any justice, it is only a matter of time before the work of the curiously-named DBC Pierre becomes essential reading for anyone interested in cutting-edge writing today. <span style="font-style:italic;">Vernon God Little</span> is a book that has a totally individual (and very quirky) identity, from a writer with a finger on the pulse of contemporary society (particularly its less comfortable aspects). Pierre is also a satirical writer in the vein of such talents as Terry Southern, and there is a manic quality to his work that makes the experience of reading him both disorienting and exhilarating. As a first novel, this is a remarkable achievement.
  
  
  
  Teenager Vernon Gregory Little's life has been changed by the Columbine-style slaughter of a group of students at his high school. Soon his hole-in-the-wall town is blanketed under a media siege, and Vernon finds himself blamed for the killing (rather than the real culprit, a friend of Vernon's). Eulalio Ledesma is his particular nemesis, manipulating things so that Vernon becomes the fulcrum for the bizarre and vengeful impulses of the townspeople of Martirio. After a truly surrealistic set of events, Vernon finds himself heading for a fateful assignation in Mexico with the delectable Taylor Figueros (everyone in the book has names as odd as the author's).
  
  
  
  By setting his novel in the barbecue-sauce capital of Central Texas, Pierre ensures that his narrative is going to be some distance from naturalistic writing. And as a scalpel-like satirical incision into the mores of contemporary America, reality TV and media hysteria, <span style="font-style:italic;">Vernon God Little</span> often reads like a fractured modern-day take on such novels as John Kennedy Toole's <span style="font-style:italic;">A Confederacy of Dunces</span>. --<span style="font-style:italic;">Barry Forshaw&nbsp;</span></span></p>
  
