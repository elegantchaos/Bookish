notes: |-
  <p><span style="font-size:12pt;color:WindowText;">In <span style="font-style:italic;">True History of the Kelly Gang</span> Peter Carey returns to the harsh, brutal world of Australian history, so brilliantly evoked in earlier novels such as <span style="font-style:italic;">Illywhacker</span> and <span style="font-style:italic;">Oscar and Lucinda</span>. Set in the desolate settler communities north of Melbourne in the late 19th century, the novel is told in the form of a journal, written by the famous outlaw and "bushranger" Ned Kelly, to a daughter he will never see. As Kelly explains, "I lost my own father at 12 yr. of age and know what it is to be raised on lies and silences my dear daughter you are presently too young to understand a word I write but this history is for you and will contain no single lies may I burn in hell if I speak false".
  
  
  
  The salty, colloquial, unpunctuated style of Kelly's journal is reproduced with great skill, as Carey recounts the outlaw's early life with a cross-dressing, Irish immigrant sheep worker, and a beautiful but headstrong mother, always on the wrong side of the law. Inadvertently causing the arrest and death of his father, Ned realises that "there were a drought and nothing flourishing there but misery I were the oldest son I thought it time to earn my place", a decision that ultimately leads him into conflict with the law, and to form the notorious Kelly Gang.
  
  
  
  The novel contains some wonderfully lyrical and deeply moving moments, as Ned struggles to articulate the harsh injustice of the world around him, but some readers might find Carey's epistolary style rather restrictive and colourless after the first 100 pages, and lacking in the imaginative excitement of Carey's earlier novels. --<span style="font-style:italic;">Jerry Brotton&nbsp;</span></span></p>
  
publisher: "Faber and Faber Ltd"
