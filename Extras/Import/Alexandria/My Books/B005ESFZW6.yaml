  <p><span style="font-size:12pt;color:WindowText;">April 1882. Inspector Edmund Forrester travels to the Isle of Lewis in the remote Outer Hebrides to investigate the mysterious death of a young boy. Although he is told the boy's death was a fishing accident, Forrester soon begins to suspect foul play. Dark secrets lie beneath the waters of The Sound of Shiant and there are some on the island who will do anything to prevent them surfacing.
  
  
  
  "The Sound of Shiant" is a supernatural thriller set against the vibrant historical backdrop of nineteenth century Stornoway and its flourishing herring fishery.
  
  
  
