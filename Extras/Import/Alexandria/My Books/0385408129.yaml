notes: |-
  <p><span style="font-size:12pt;color:WindowText;">Imagine living in a city where the lottery has become the most important thing in everyone's life. Imagine that the lottery is based on dominoes, which only form their winning or losing combination as the Friday night draw is made. Imagine that people will kill to obtain winning dominoes. Imagine adverts exhorting you to play the lottery as they fly around in the air. Now set all that in Manchester in 1999.
  
  
  
  <span style="font-style:italic;">Nymphomation</span> presents an alternate reality in which Manchester has become a test bed for the new game and its sinister undertones. The story is driven by characters recognisable as real people--students, street dwellers, musicians, waiters. They get caught up in what becomes for some of them a fight to the death to defeat the controlling power of the lottery and its head, Mr Million.
  
  
  
  Noon writes with an accomplished mix of wit and darkness, and manages to invent a whole dictionary of new words along the way. Whoompy burgers sponsor the police and control the Net, blurbflies carry the adverts around the streets and the nymphomania itself tries to control but has to be controlled. The upshot is an imaginative and disturbing horror/cyberpunk/science fiction mix with plenty of harsh reality and social comment thrown in. --<span style="font-style:italic;">Sandra Vogel&nbsp;</span></span></p>
  
publisher: "Doubleday"
publishing_year: "1997"
