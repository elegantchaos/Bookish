  <p><span style="font-size:12pt;color:WindowText;">The term "space opera" has evolved over the decades. Originally it meant "hacky, grinding, stinking, outworn, spaceship yarn" (Wilson Tucker), but since then it has come to be (slightly) less pejorative, encompassing any sci-fi action story on an interplanetary or interstellar scale. <span style="font-style:italic;">The Reality Dysfunction</span> rests firmly in the space- opera camp with its intense starship combat, roguish space captains and raw frontier planets, but Peter Hamilton keeps the formula fresh and up-to-date with an infusion of "modern" science fiction technology. His universe is digitally and nanotechnologically savvy, which opens up plenty of possibilities for new perils and plot twists.
  
  
  
  It is the late 26th century and humanity's thriving culture spans 200 planets. The usual squabbles and disagreements continue, but generally everyone gets along and lives well as humanity's outward expansion continues apace. On newly colonized Lalonde, though, a strange force emerges from the jungle, lobotomizing people and turning them into super-powered soldiers. At the same time, the story of Joshua Calvert emerges. He's the young captain of a trading ship, who innocently travels to Lalonde and becomes embroiled in the mysteries there. Both threads have plenty of action and exotic scenery. Peter Hamilton's descriptive prose, particularly in action sequences, is breathtaking (and scientifically accurate), creating a dramatic backdrop for a story where the stakes keep getting higher, the villains keep growing more evil and the heroes keep surviving--but only just. Space-opera fans will enjoy this deftly written and engaging novel. Those who feel they don't like the genre might give this example a try to see just how unhacky, ungrinding, sweet-smelling, and robust it can be. --<span style="font-style:italic;">Brooks Peck&nbsp;</span></span></p>
  
