  <p><span style="font-style:italic;font-size:12pt;color:WindowText;">Carpe Jugulum<span style="font-style:normal;"> is the 23rd Discworld novel, and with it this durable series continues its juggernaut procession onwards. Pratchett is an author who inspires such devotions that his fans will fall on the novel with cries of joy. Non-fans, perhaps, will want to know what all the fuss is about; and that's something difficult to put into a few words. The best thing to do for those completely new to Pratchett is to sample him for themselves, and this novel is as good a place to start as any. But fans have a more precise question. They know that Discworld novels come in one of two varieties: the quite good, and the brilliant. So, for instance, where </span>Hogfather<span style="font-style:normal;"> and </span>Maskerade<span style="font-style:normal;"> were quite good, </span>Feet of Clay<span style="font-style:normal;"> and </span>Jingo<span style="font-style:normal;"> were brilliant. While true fans wouldn't want to do without the former, they absolutely live for the latter. And with </span>Carpe Jugulum<span style="font-style:normal;"> Pratchett has hit jackpot again. This novel is one of the brilliant ones.
  
  
  
  The plot is a version of an earlier Discworld novel, Lords and Ladies, with the predatory elves of that novel being replaced here by suave and deadly vampires, and the tiny kingdom of Lancre being defended by its witches. But plot is the least of Pratchett's appeal, and Carpe Jugulum is loaded with marvellous characters (not least the witches themselves, about whom we learn a deal more here), comic touches and scenes of genius, and even some of the renowned down-to-earth Pratchett wisdom (here about the inner ethical conflicts we all face, and the wrongness of treating people as things). Pratchett's vampires are elegant Bela Lugosi types, and they come up against an unlikely but engaging alliance of witches, blue-skinned pixies like Rob Roy Smurfs, a doubting priest with a boil on his face and a magical house-sized Phoenix in a seamless, completely absorbing and feel-good-about-the-universe mixture. Highly recommended. --</span>Adam Roberts&nbsp;</span></p>
  
publisher: "Corgi Adult"
