  <p><span style="font-size:12pt;color:WindowText;">Detective Inspector John Rebus is not a man easily intimidated, so when political heavyweights start to lean on the dour, moralistic Edinburgh detective to stop an investigation, Rebus doggedly digs in and follows the case as it moves from embezzlement to murder and finally to conspiracy at the highest level of government.
  
  
  
  Bill Paterson has just the right gritty edge to his voice to produce a convincing portrayal of jaded Edinburgh copper, Rebus. In the course of his investigation, Rebus comes into contact with all levels of Edinburgh society and Paterson finds convincing, unobtrusive voices for all of them. His reading is clear, well-paced and totally absorbing throughout. <span style="font-style:italic;">(Running time approx 3 hours 20 minutes)&nbsp;</span></span></p>
  
