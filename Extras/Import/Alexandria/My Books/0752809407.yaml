  <p><span style="font-size:12pt;color:WindowText;">Because the first body was found in Wolf Street, because the murderer takes a bite from each body, the press have found a new terror, the Wolfman...
  
  
  
  Drafted down to the Big Smoke thanks to his expertise in the modus operandi of serial killers, Inspector John Rebus is on a train south from Edinburgh. His Scotland Yard opposite number, George Flight, isn't too happy at yet more interference. It's bad enough having several Chief Inspectors on your back without being hounded at every turn by an upstart Jock. Rebus is going to have to deal with racial prejudice as well as the predations of a violent maniac. When he's offered a serial killer profile of the Wolfman by an attractive lady psychologist, it's too good an opportunity to turn down. But in finding an ally, he may have given his enemies an easy means of attack.&nbsp;</span></p>
  
